<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusAI — Your Campus. One Intelligent Place.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">

<style>
:root{
  --bg:#f8fafc;
  --surface:#fff;
  --primary:#4f46e5;
  --primary-dark:#4338ca;
  --ai:#06b6d4;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --soft:#f1f5f9;
  --soft2:#eef2ff;
  --radius:16px;
  --shadow:0 1px 3px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

h1,h2,h3,h4{
  font-family:"Plus Jakarta Sans",sans-serif;
  margin:0
}

a{
  text-decoration:none;
  color:inherit
}

.app{
  min-height:100vh;
  display:flex
}

.sidebar{
  width:248px;
  background:#fff;
  border-right:1px solid var(--border);
  position:fixed;
  inset:0 auto 0 0;
  padding:22px 16px;
  z-index:20
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 10px 24px
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--ai));
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:800
}

.brand-name{
  font-family:"Plus Jakarta Sans";
  font-weight:700;
  font-size:18px
}

.brand-sub{
  font-size:11px;
  color:var(--muted)
}

.nav-section{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#94a3b8;
  padding:14px 10px 7px
}

.nav{
  display:grid;
  gap:4px
}

.nav button{
  border:0;
  background:transparent;
  color:#475569;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:10px
}

.nav button:hover,
.nav button.active{
  background:#eef2ff;
  color:var(--primary);
  font-weight:600
}

.nav .ai-link{
  color:#0891b2
}

.sidebar-footer{
  position:absolute;
  left:16px;
  right:16px;
  bottom:18px;
  border-top:1px solid var(--border);
  padding-top:14px
}

.main{
  margin-left:248px;
  width:calc(100% - 248px);
  min-height:100vh
}

.topbar{
  height:68px;
  background:rgba(248,250,252,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(226,232,240,.8);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 34px;
  position:sticky;
  top:0;
  z-index:10
}

.crumb{
  font-size:13px;
  color:var(--muted)
}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center
}

.icon-btn{
  border:1px solid var(--border);
  background:#fff;
  width:38px;
  height:38px;
  border-radius:10px;
  display:grid;
  place-items:center;
  color:#475569
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#dbeafe;
  color:#1e40af;
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:13px
}

.page{
  max-width:1180px;
  margin:0 auto;
  padding:34px
}

.page-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-end;
  margin-bottom:24px
}

.eyebrow{
  font-size:12px;
  color:var(--primary);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:7px
}

.page-head h1{
  font-size:30px;
  letter-spacing:-.03em
}

.subtitle{
  color:var(--muted);
  margin-top:8px;
  line-height:1.6
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow)
}

.btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  border-radius:9px;
  padding:10px 14px;
  font-weight:600;
  display:inline-flex;
  gap:8px;
  align-items:center;
  justify-content:center
}

.btn:hover{
  background:var(--soft)
}

.btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}

.btn.primary:hover{
  background:var(--primary-dark)
}

.btn.ai{
  background:linear-gradient(135deg,var(--primary),var(--ai));
  border:0;
  color:#fff
}

.material-symbols-outlined{
  font-size:20px;
  vertical-align:middle
}

.hero{
  padding:30px;
  background:linear-gradient(135deg,#eef2ff 0%,#fff 55%,#ecfeff 100%);
  overflow:hidden;
  position:relative
}

.hero h1{
  font-size:34px;
  max-width:720px
}

.hero p{
  max-width:680px;
  color:#475569;
  line-height:1.7;
  margin:10px 0 22px
}

.search{
  display:flex;
  align-items:center;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 13px;
  height:50px;
  max-width:760px;
  box-shadow:0 8px 24px rgba(15,23,42,.05)
}

.search input{
  border:0;
  outline:0;
  flex:1;
  padding:0 10px;
  background:transparent;
  color:var(--text)
}

.chips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}

.chip{
  border:1px solid var(--border);
  background:#fff;
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  color:#475569
}

.chip:hover{
  border-color:#c7d2fe;
  color:var(--primary)
}

.grid{
  display:grid;
  gap:16px
}

.grid-4{
  grid-template-columns:repeat(4,1fr)
}

.grid-3{
  grid-template-columns:repeat(3,1fr)
}

.grid-2{
  grid-template-columns:repeat(2,1fr)
}

.section{
  margin-top:26px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.section-head h2{
  font-size:18px
}

.muted{
  color:var(--muted);
  font-size:13px
}

.stat{
  padding:18px
}

.stat-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px
}

.stat-num{
  font:700 25px "Plus Jakarta Sans";
  margin-top:10px
}

.stat-accent{
  color:var(--primary)
}

.category{
  padding:17px;
  display:flex;
  gap:12px;
  align-items:center
}

.cat-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#eef2ff;
  color:var(--primary);
  display:grid;
  place-items:center
}

.category strong{
  display:block;
  font-size:14px
}

.category span{
  font-size:12px;
  color:var(--muted)
}

.notice{
  padding:18px
}

.notice-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700
}

.badge.workshop{
  background:#ecfeff;
  color:#0e7490
}

.badge.placement{
  background:#eef2ff;
  color:#4338ca
}

.badge.event{
  background:#fef3c7;
  color:#92400e
}

.badge.scholarship{
  background:#ecfdf5;
  color:#047857
}

.badge.academic{
  background:#f1f5f9;
  color:#475569
}

.notice h3{
  font-size:16px;
  margin-top:12px
}

.notice p{
  font-size:13px;
  color:var(--muted);
  line-height:1.55;
  margin:8px 0
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  color:#64748b;
  font-size:11px;
  margin:12px 0
}

.deadline{
  font-size:12px;
  font-weight:700;
  color:var(--danger)
}

.notice-actions{
  display:flex;
  gap:8px;
  margin-top:14px
}

.notice-actions .btn{
  flex:1;
  padding:9px 10px;
  font-size:12px
}

.bookmark{
  width:38px;
  flex:0!important
}

.filters{
  padding:14px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center
}

.filters input,
.filters select,
.form-control{
  border:1px solid var(--border);
  border-radius:9px;
  background:#fff;
  padding:10px 11px;
  outline:0
}

.filters input{
  min-width:240px;
  flex:1
}

.filters input:focus,
.filters select:focus,
.form-control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(79,70,229,.1)
}

.deadline-card{
  padding:18px
}

.deadline-card .date{
  font:700 20px "Plus Jakarta Sans";
  margin:5px 0
}

.deadline-card .bar{
  height:6px;
  background:#e2e8f0;
  border-radius:99px;
  overflow:hidden;
  margin:12px 0
}

.deadline-card .bar span{
  display:block;
  height:100%;
  background:var(--warning);
  width:72%
}

.ai-hero{
  padding:28px;
  text-align:center;
  background:linear-gradient(135deg,#eef2ff,#ecfeff)
}

.ai-orb{
  width:54px;
  height:54px;
  border-radius:16px;
  margin:0 auto 14px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--ai));
  box-shadow:0 12px 28px rgba(6,182,212,.2)
}

.ai-hero h1{
  font-size:28px
}

.ai-hero p{
  color:var(--muted);
  margin:8px auto 20px
}

.prompt-grid{
  max-width:780px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.prompt{
  border:1px solid var(--border);
  background:#fff;
  padding:11px;
  border-radius:10px;
  text-align:left;
  font-size:12px;
  color:#334155
}

.chat{
  max-width:900px;
  margin:20px auto
}

.message{
  display:flex;
  margin:12px 0
}

.message.user{
  justify-content:flex-end
}

.bubble{
  max-width:76%;
  padding:13px 15px;
  border-radius:14px;
  line-height:1.6;
  font-size:13px
}

.user .bubble{
  background:#eef2ff
}

.assistant .bubble{
  background:#fff;
  border:1px solid var(--border);
  box-shadow:var(--shadow)
}

.source{
  font-size:11px;
  color:var(--primary);
  margin-top:10px
}

.chat-input{
  position:sticky;
  bottom:12px;
  display:flex;
  gap:8px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  padding:8px;
  border:1px solid var(--border);
  border-radius:13px;
  box-shadow:0 12px 30px rgba(15,23,42,.08)
}

.chat-input input{
  flex:1;
  border:0;
  outline:0;
  padding:8px
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.chat-header-bar {
  max-width: 900px;
  margin: 20px auto 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-clear-btn {
  background: #f8fafc;
  border: 1px solid var(--border);
  color: #475569;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.chat-clear-btn:hover {
  background: #f1f5f9;
  color: #0f172a;
  border-color: #cbd5e1;
}

.detail{
  display:grid;
  grid-template-columns:1.6fr .8fr;
  gap:18px
}

.detail-main,
.detail-side{
  padding:24px
}

.detail-main h1{
  font-size:30px
}

.detail-main p{
  color:#475569;
  line-height:1.75
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:20px 0
}

.info-item{
  padding:12px;
  background:var(--soft);
  border-radius:10px
}

.info-item span{
  font-size:11px;
  color:var(--muted);
  display:block
}

.info-item strong{
  font-size:13px;
  display:block;
  margin-top:3px
}

.deadline-box{
  padding:18px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  border-radius:13px
}

.deadline-box .big{
  font:700 22px "Plus Jakarta Sans";
  margin:5px 0;
  color:#9a3412
}

.table-wrap{
  overflow:auto
}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,
.table td{
  text-align:left;
  padding:13px 14px;
  border-bottom:1px solid var(--border);
  font-size:12px
}

.table th{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--muted);
  background:#f8fafc
}

.status{
  font-size:11px;
  font-weight:700;
  padding:5px 8px;
  border-radius:999px;
  background:#ecfdf5;
  color:#047857
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.form-field{
  display:grid;
  gap:7px
}

.form-field.full{
  grid-column:1/-1
}

.form-field label{
  font-size:12px;
  font-weight:700
}

.form-control{
  width:100%
}

textarea.form-control{
  min-height:130px;
  resize:vertical
}

.preview{
  padding:20px;
  background:#f8fafc;
  border-radius:12px;
  border:1px dashed #cbd5e1
}

.upload{
  border:1px dashed #94a3b8;
  padding:24px;
  text-align:center;
  border-radius:12px;
  color:var(--muted)
}

.empty{
  padding:44px;
  text-align:center
}

.empty .material-symbols-outlined{
  font-size:44px;
  color:#94a3b8
}

.empty h3{
  margin-top:10px;
  font-size:17px
}

.empty p{
  color:var(--muted);
  font-size:13px
}

.mobile-nav{
  display:none
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#0f172a;
  color:#fff;
  padding:12px 15px;
  border-radius:10px;
  box-shadow:0 15px 35px rgba(15,23,42,.2);
  font-size:12px;
  z-index:100;
  opacity:0;
  transform:translateY(8px);
  transition:.2s
}

.toast.show{
  opacity:1;
  transform:translateY(0)
}

@media(max-width:900px){
  .sidebar{display:none}

  .main{
    margin-left:0;
    width:100%
  }

  .topbar{
    padding:0 16px
  }

  .page{
    padding:22px 16px
  }

  .grid-4{
    grid-template-columns:repeat(2,1fr)
  }

  .grid-3{
    grid-template-columns:1fr 1fr
  }

  .detail{
    grid-template-columns:1fr
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:10px;
    left:10px;
    right:10px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(14px);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 12px 30px rgba(15,23,42,.1);
    z-index:30;
    padding:7px;
    justify-content:space-around
  }

  .mobile-nav button{
    background:none;
    border:0;
    color:#64748b;
    font-size:10px;
    display:grid;
    gap:2px;
    place-items:center
  }

  .mobile-nav button.active{
    color:var(--primary);
    font-weight:700
  }

  .mobile-nav .material-symbols-outlined{
    font-size:20px
  }
}

@media(max-width:600px){
  .grid-4,
  .grid-3,
  .grid-2,
  .prompt-grid,
  .form-grid,
  .info-grid{
    grid-template-columns:1fr
  }

  .page-head{
    align-items:flex-start;
    flex-direction:column
  }

  .hero h1{
    font-size:28px
  }

  .detail-main h1{
    font-size:25px
  }

  .filters input{
    min-width:100%
  }

  .topbar{
    height:60px
  }

  .page{
    padding-top:22px
  }

  .hero{
    padding:22px
  }

  .notice-actions{
    flex-wrap:wrap
  }

  .notice-actions .btn:first-child{
    flex-basis:100%
  }
}

/* =========================================================
   CAMPUSAI AUTHENTICATION
   CAMPUSAI_AUTH_V1
   Local development authentication only.
   Production authentication will use Amazon Cognito.
   ========================================================= */

#authView{
  min-height:100vh;
  width:100%;
}

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
}

.auth-container{
  width:min(1050px,100%);
  display:grid;
  grid-template-columns:1.05fr .95fr;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(15,23,42,.12);
}

.auth-brand{
  padding:55px;
  background:linear-gradient(145deg,#312e81,#4f46e5);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.auth-brand .material-symbols-outlined{
  font-size:50px;
  margin-bottom:20px;
}

.auth-brand h1{
  font-size:42px;
  margin:0 0 12px;
  line-height:1.1;
}

.auth-brand p{
  opacity:.88;
  line-height:1.7;
  max-width:470px;
}

.auth-card{
  padding:45px;
}

.auth-card h2{
  margin:0 0 8px;
  font-size:28px;
}

.auth-subtitle{
  color:#64748b;
  margin-bottom:25px;
  line-height:1.5;
}

.role-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:25px;
}

.role-option{
  border:1px solid #e2e8f0;
  background:#fff;
  border-radius:16px;
  padding:22px 12px;
  cursor:pointer;
  transition:.2s;
  text-align:center;
}

.role-option:hover{
  border-color:#4f46e5;
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(79,70,229,.12);
}

.role-option .material-symbols-outlined{
  display:block;
  font-size:30px;
  margin-bottom:10px;
  color:#4f46e5;
}

.role-option strong{
  display:block;
  font-size:14px;
}

.role-option span{
  display:block;
  color:#64748b;
  font-size:11px;
  margin-top:5px;
}

.auth-form{
  margin-top:20px;
}

.auth-form label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:15px 0 7px;
}

.auth-form input{
  width:100%;
  box-sizing:border-box;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:12px 13px;
  font-size:14px;
  outline:none;
}

.auth-form input:focus{
  border-color:#4f46e5;
  box-shadow:0 0 0 3px rgba(79,70,229,.1);
}

.auth-submit{
  width:100%;
  margin-top:20px;
  border:0;
  border-radius:10px;
  padding:13px;
  background:#4f46e5;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.auth-back{
  border:0;
  background:transparent;
  color:#4f46e5;
  cursor:pointer;
  padding:0;
  font-weight:700;
  margin-bottom:20px;
}

.auth-error{
  display:none;
  margin-top:15px;
  padding:11px;
  border-radius:9px;
  background:#fef2f2;
  color:#b91c1c;
  font-size:13px;
}

.demo-box{
  margin-top:22px;
  padding:14px;
  background:#f8fafc;

/* =========================================================
   CAMPUSAI FRONTEND
   ========================================================= */

/*
   IMPORTANT:

   The frontend talks to Flask using a relative URL.

   That means we will open CampusAI through:

   http://127.0.0.1:5000/

   instead of double-clicking index.html.

   This keeps frontend + backend on the same origin.
*/

const API_URL = "/api/notices";
const ASK_API_URL = "/api/ask";

function escapeHtml(str){
  if(str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   NOTICE DATA
   ========================================================= */

/*
   IMPORTANT:
   There are NO hard-coded notices here.

   Notices come from the Flask backend/database.
*/

let notices = [];

let noticesLoaded = false;


/* =========================================================
   LOAD NOTICES FROM BACKEND
   ========================================================= */

async function loadNotices(){

  try{

    const response = await fetch(API_URL);

    if(!response.ok){
      throw new Error("Failed to load notices");
    }

    const data = await response.json();

    /*
       Read previously saved notice IDs from browser storage.
    */

    let savedIds = [];

    try{
      savedIds = JSON.parse(
        localStorage.getItem("campusai_saved_notices") || "[]"
      );
    }catch(error){
      savedIds = [];
    }


    /*
       Convert backend field names
       into the names used by the frontend.
    */

    notices = data.map(n => ({

      id: n.id,

      title: n.title,

      category: n.category || "Academic",

      department: n.department || "All Departments",

      year: n.year || "All Years",

      date: n.event_date || "—",

      deadline: n.deadline || "—",

      venue: n.venue || "—",

      desc: n.description || "",

      priority: n.priority || "Normal",

      saved: savedIds.includes(n.id),

      registration_url: n.registration_url || null,

      document_url: n.document_url || null,

      created_at: n.created_at || null

    }));


    noticesLoaded = true;

    render();

  }catch(error){

    console.error("Error loading notices:", error);

    notices = [];

    noticesLoaded = false;

    document.getElementById("app").innerHTML = `

      <div class="page">

        <div class="card empty">

          <span class="material-symbols-outlined">
            cloud_off
          </span>

          <h3>
            Unable to load campus notices
          </h3>

          <p>
            Please make sure the CampusAI Flask backend is running.
          </p>

          <button
            class="btn primary"
            onclick="loadNotices()"
            style="margin-top:14px"
          >
            Retry
          </button>

        </div>

      </div>

    `;

  }

}


/* =========================================================
   SAVE NOTICE
   ========================================================= */

function saveSavedIds(){

  const savedIds = notices
    .filter(n => n.saved)
    .map(n => n.id);

  localStorage.setItem(
    "campusai_saved_notices",
    JSON.stringify(savedIds)
  );

}


function toggleSave(id){

  const n = notices.find(x => x.id === id);

  if(!n){
    return;
  }

  n.saved = !n.saved;

  saveSavedIds();

  toast(
    n.saved
      ? "Notice saved."
      : "Notice removed from saved."
  );

  render();

}

   TOAST
   ========================================================= */

function toast(msg){

  const t = document.getElementById("toast");

  t.textContent = msg;

  t.classList.add("show");

  setTimeout(
    () => t.classList.remove("show"),
    2200
  );

}

function setCat(c){

  document.getElementById("categoryFilter").value = c;

  filterNotices();

}


function filterNotices(){

  const q =
    (
      document.getElementById("noticeSearch")?.value || ""
    ).toLowerCase();

  const c =
    document.getElementById("categoryFilter")?.value || "";

  const d =
    document.getElementById("deptFilter")?.value || "";


  const list = notices.filter(n =>

    (
      !q ||
      `${n.title} ${n.desc} ${n.category} ${n.department}`
        .toLowerCase()
        .includes(q)
    )

    &&

    (!c || n.category === c)

    &&

    (!d || n.department === d)

  );


  document.getElementById("noticeResults").innerHTML =

    list.length

    ?

    list.map(noticeCard).join("")

    :

    `
      <div
        class="card empty"
        style="grid-column:1/-1"
      >

        <span class="material-symbols-outlined">
          search_off
        </span>

        <h3>
          No notices found
        </h3>

        <p>
          Try a different search or clear your filters.
        </p>

      </div>
    `;

}

function ask(q){

  document.getElementById("chatInput").value = q;

  sendQuestion();

}


async function sendQuestion(){

  const input =
    document.getElementById("chatInput");

  const sendBtn =
    document.querySelector(".chat-input button");

  if(!input){
    return;
  }

  const q =
    input.value.trim();

  if(!q){
    return;
  }

  const chat =
    document.getElementById("chat");

  if(!chat){
    return;
  }

  // Render user question bubble
  chat.insertAdjacentHTML(
    "beforeend",
    `
      <div class="message user">
        <div class="bubble">
          ${escapeHtml(q)}
        </div>
      </div>
    `
  );

  // Clear input and show loading indicator
  input.value = "";
  input.disabled = true;
  if(sendBtn) sendBtn.disabled = true;

  const loadingId = "aiLoading_" + Date.now();
  chat.insertAdjacentHTML(
    "beforeend",
    `
      <div class="message assistant" id="${loadingId}">
        <div class="bubble" style="display:flex;align-items:center;gap:10px;color:#64748b;">
          <span class="material-symbols-outlined" style="animation:spin 1.2s linear infinite;font-size:18px;color:var(--primary);">
            sync
          </span>
          <span>CampusAI is thinking...</span>
        </div>
      </div>
    `
  );

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ question: q })
    });

    const loadingElem = document.getElementById(loadingId);
    if(loadingElem) loadingElem.remove();

    if(!res.ok){
      const errData = await res.json().catch(() => ({}));
      const errMsg = errData.error || `Server responded with status ${res.status}`;
      chat.insertAdjacentHTML(
        "beforeend",
        `
          <div class="message assistant">
            <div class="bubble" style="border-left:3px solid #ef4444;background:#fef2f2;">
              <strong style="color:#b91c1c;">CampusAI Assistant Notice</strong>
              <br><br>
              <span style="color:#7f1d1d;">${escapeHtml(errMsg)}</span>
            </div>
          </div>
        `
      );
    } else {
      const data = await res.json();
      const answer = data.answer || "No response received.";
      const sourcesCount = data.sources && Array.isArray(data.sources) ? data.sources.length : 0;
      const providerName = data.provider || "CampusAI Intelligence";

      chat.insertAdjacentHTML(
        "beforeend",
        `
          <div class="message assistant">
            <div class="bubble">
              <strong>
                CampusAI Intelligence
              </strong>
              <br><br>
              ${answer}
              <div class="source">
                Sources: ${sourcesCount > 0 ? sourcesCount + " campus record(s)" : "Campus database"} •
                Powered by ${escapeHtml(providerName)}
              </div>
            </div>
          </div>
        `
      );
    }
  } catch(err) {
    const loadingElem = document.getElementById(loadingId);
    if(loadingElem) loadingElem.remove();

    chat.insertAdjacentHTML(
      "beforeend",
      `
        <div class="message assistant">
          <div class="bubble" style="border-left:3px solid #ef4444;background:#fef2f2;">
            <strong style="color:#b91c1c;">Connection Error</strong>
            <br><br>
            <span style="color:#7f1d1d;">Unable to reach CampusAI Intelligence API at <code>/api/ask</code>. Please verify that the Flask server is running (<code>python app.py</code>).</span>
          </div>
        </div>
      `
    );
  } finally {
    input.disabled = false;
    if(sendBtn) sendBtn.disabled = false;
    input.focus();

    setTimeout(() => {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }, 100);
  }

}


function clearChat(){

  const chat =
    document.getElementById("chat");

  if(!chat){
    return;
  }

  chat.innerHTML = `
    <div class="message assistant">
      <div class="bubble">
        <strong>

        </strong>
        <br><br>
        Hi! Ask me about campus notices, events, deadlines and opportunities.
        I'll query available campus records to find the information you need.

        </div>

  `;

}

async function executeDeleteNotice(id){
  const btn = document.getElementById("confirmDeleteBtn");
  if(btn){
    btn.disabled = true;
    btn.textContent = "Deleting...";
  }
  try {
    const res = await fetch(`/api/notices/${id}`, {
      method: "DELETE"
    });
    const modal = document.getElementById("deleteConfirmModal");
    if(modal) modal.remove();

    if(!res.ok){
      const data = await res.json().catch(() => ({}));
      toast(data.error || "Failed to delete notice.");
      return;
    }

    toast("Notice deleted successfully!");
    await loadNotices();
    render();
  } catch(err){
    console.error(err);
    const modal = document.getElementById("deleteConfirmModal");
    if(modal) modal.remove();
    toast("Network error deleting notice.");
  }
}

async function updateNotice(event, id){
  event.preventDefault();

  const titleInput = document.getElementById("editNoticeTitle");
  const descInput = document.getElementById("editNoticeDescription");
  const saveBtn = document.getElementById("saveNoticeBtn");

  const title = titleInput ? titleInput.value.trim() : "";
  const description = descInput ? descInput.value.trim() : "";

  if(!title || !description){
    toast("Title and description are required.");
    return;
  }

  const payload = {
    title: title,
    description: description,
    category: document.getElementById("editNoticeCategory")?.value || "General",
    department: document.getElementById("editNoticeDepartment")?.value || "All Departments",
    year: document.getElementById("editNoticeYear")?.value || "All Years",
    priority: document.getElementById("editNoticePriority")?.value || "Normal",
    event_date: document.getElementById("editNoticeEventDate")?.value || null,
    deadline: document.getElementById("editNoticeDeadline")?.value || null,
    venue: document.getElementById("editNoticeVenue")?.value.trim() || null,
    registration_url: document.getElementById("editNoticeRegistrationUrl")?.value.trim() || null,
    document_url: document.getElementById("editNoticeDocumentUrl")?.value.trim() || null
  };

  if(saveBtn){
    saveBtn.disabled = true;
    saveBtn.innerHTML = `
      <span class="material-symbols-outlined" style="animation:spin 1s linear infinite;font-size:18px;vertical-align:middle;margin-right:4px;">
        sync
      </span>
      Saving Changes...
    `;
  }

  try {
    const res = await fetch(`/api/notices/${id}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json().catch(() => ({}));

    if(!res.ok){
      throw new Error(data.error || "Failed to update notice.");
    }

    toast("Notice updated successfully!");
    await loadNotices();
    navigate("manage");

  } catch(err){
    console.error(err);
    toast(err.message || "Unable to save notice changes.");
    if(saveBtn){
      saveBtn.disabled = false;
      saveBtn.innerHTML = `
        <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:4px;">
          save
        </span>
        Save Changes
      `;
    }
  }
}


/* =========================================================
   DOCUMENT UPLOAD (AMAZON S3) HANDLER
   ========================================================= */

async function handleNoticeFileSelect(fileInput, targetUrlInputId){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;

  const statusElem = fileInput.id === "editNoticeFileInput"
    ? document.getElementById("editNoticeFileStatus")
    : document.getElementById("noticeFileStatus");

  if(statusElem){
    statusElem.innerHTML = `<span class="material-symbols-outlined" style="animation:spin 1s linear infinite;font-size:16px;vertical-align:middle;">sync</span> Uploading ${escapeHtml(file.name)}...`;
  }

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      body: formData
    });
    const data = await res.json();
    if(!res.ok){
      throw new Error(data.error || "Failed to upload file");
    }

    const targetInput = document.getElementById(targetUrlInputId);
    if(targetInput){
      targetInput.value = data.url;
    }

    const storageLabel = data.storage === "s3" ? "Amazon S3" : "Storage";
    if(statusElem){
      statusElem.innerHTML = `✅ <span style="color:#10b981;font-weight:600;">Uploaded to ${storageLabel}:</span> ${escapeHtml(file.name)}`;
    }
    toast(`Document uploaded to ${storageLabel}!`);
  } catch(err){
    console.error(err);
    if(statusElem){
      statusElem.innerHTML = `❌ <span style="color:#ef4444;">Upload failed</span>`;
    }
    toast("Upload failed: " + (err.message || "Unknown error"));
  }
}


function filterManageNotices(){

  const q =
    (
      document.getElementById("manageSearch")?.value || ""
    ).toLowerCase();


  const c =
    document.getElementById("manageCategory")?.value || "";


  const list =
    notices.filter(n =>

      (
        !q ||
        `${n.title} ${n.description || n.desc} ${n.department}`
          .toLowerCase()
          .includes(q)
      )

      &&

      (!c || n.category === c)

    );


  document.getElementById("manageResults").innerHTML =
    manageRows(list);

}

/* =========================================================
   PUBLISH NOTICE TO FLASK
   ========================================================= */

async function publishNotice(event){

  event.preventDefault();


  const button =
    document.getElementById("publishButton");


  const notice = {

    title:
      document.getElementById("noticeTitle").value.trim(),

    description:
      document.getElementById("noticeDescription").value.trim(),

    category:
      document.getElementById("noticeCategory").value,

    department:
      document.getElementById("noticeDepartment").value,

    year:
      document.getElementById("noticeYear").value,

    priority:
      document.getElementById("noticePriority").value,

    event_date:
      document.getElementById("noticeEventDate").value || null,

    deadline:
      document.getElementById("noticeDeadline").value || null,

    venue:
      document.getElementById("noticeVenue").value.trim() || null,

    registration_url:
      document.getElementById("noticeRegistrationUrl").value.trim() || null,

    document_url:
      document.getElementById("noticeDocUrl")?.value.trim() || null

  };


  if(!notice.title || !notice.description){

    toast("Title and description are required.");

    return;

  }


  try{

    button.disabled = true;

    button.innerHTML = `

      <span class="material-symbols-outlined">
        hourglass_top
      </span>

      Publishing...

    `;


    const response =
      await fetch(API_URL, {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(notice)

      });


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Failed to create notice"
      );

    }


    toast(
      "Notice published successfully!"
    );


    /*
       Reload notices from the database.
       This is important because it proves
       the frontend is now reading the real
       backend data.
    */

    await loadNotices();


    /*
       Go to the student notices page
       so we can immediately see the
       newly published notice.
    */

    navigate("notices");


  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Unable to publish notice."
    );


    button.disabled = false;

    button.innerHTML = `

      <span class="material-symbols-outlined">
        publish
      </span>

      Publish Notice

    `;

  }

}

function renderApp(){

  let r = current();

  let route = r.split("-")[0];

  let content;


  if(route === "detail"){

    content =
      detailPage(r.split("-")[1]);

  }

  else if(route === "home"){

    content = home();

  }

  else if(route === "notices"){

    content = noticesPage();

  }

  else if(route === "events"){

    content = eventsPage();

  }

  else if(route === "saved"){

    content = savedPage();

  }

  else if(route === "ask"){

    content = askPage();

  }

  else if(route === "admin"){

    content = adminPage();

  }

  else if(route === "faculty"){

    content = facultyPage();

  }

  else if(route === "profile"){

    content = campusProfilePage();

  }

  else if(route === "manage"){

    content = managePage();

  }

  else if(route === "create"){

    content = createPage();

  }

  else if(route === "edit"){

    content = editPage(r.split("-")[1]);

  }

  else{

    content = home();

  }


  document.getElementById("app").innerHTML =
    content;


  document.getElementById("crumb").textContent =
    routeNames[route] || "CampusAI";


  document
    .querySelectorAll("[data-route]")
    .forEach(b =>
      b.classList.toggle(
        "active",
        b.dataset.route === route
      )
    );


  document
    .querySelectorAll("[data-route]")
    .forEach(b =>
      b.onclick = () =>
        navigate(b.dataset.route)
    );

}

function setSession(user){
  if(!user){
    clearSession();
    return;

  const sessionData = {
    ...user,
    role: user.role,
    label: user.label || (user.role === "student" ? "Student" : user.role === "faculty" ? "Faculty" : "Administrator"),
    name: user.name || (user.firstName ? `${user.firstName} ${user.lastName || ""}`.trim() : user.identifier),

    email: user.email || (user.identifier && user.identifier.includes("@") ? user.identifier : ""),
    profileComplete: typeof user.profileComplete === "boolean" ? user.profileComplete : true,
    loginAt: user.loginAt || new Date().toISOString()
  };
  localStorage.setItem(
    "campusai_session",
    JSON.stringify(sessionData)
  );
}

function handleLogin(event, role){

  event.preventDefault();

  const identifierInput = document.getElementById("loginIdentifier");
  const passwordInput = document.getElementById("loginPassword");
  const error = document.getElementById("authError");

  const identifier = (identifierInput ? identifierInput.value : "").trim().toLowerCase();
  const password = passwordInput ? passwordInput.value : "";

  // Validate required fields
  if(!identifier || !password || !password.trim()){
    if(error){
      error.textContent = "Please enter your email/username and password.";
      error.style.display = "block";
    }
    return;
  }

  // Load registered users from campusai_users
  const registeredUsers = typeof getCampusUsers === "function" ? getCampusUsers() : [];

  // Find user matching role and email or identifier (case-insensitive & trimmed)
  const registeredUser = registeredUsers.find(u =>
    String(u.role || "").toLowerCase() === role.toLowerCase() &&
    (
      String(u.email || "").trim().toLowerCase() === identifier ||
      String(u.identifier || "").trim().toLowerCase() === identifier ||
      String(u.name || "").trim().toLowerCase() === identifier
    )
  );

  // Check demo fallback only if no registered user matched identifier
  const demoUser = DEMO_USERS[role];
  const isDemo = !registeredUser && demoUser && (
    String(demoUser.identifier || "").trim().toLowerCase() === identifier ||
    String(demoUser.email || "").trim().toLowerCase() === identifier
  );

  const user = registeredUser || (isDemo ? demoUser : null);

  // Verify password (supports exact match and trimmed match)
  const passwordMatches = user && (
    password === user.password ||
    password.trim() === String(user.password || "").trim()
  );

  if(!user || !passwordMatches){
    if(error){
      error.textContent = "Invalid email/username or password.";
      error.style.display = "block";
    }
    return;
  }

  // Clear any active error message
  if(error){
    error.textContent = "";
    error.style.display = "none";
  }

  // Login successful: create session, preserve actual name, email, identifier, role
  setSession(user);

  /*
     New users complete their profile before
     entering the main CampusAI experience.
  */
  if(user.profileComplete === false){
    location.hash = "profile";
  } else {
    location.hash = ROLE_HOME[role] || "home";
  }

  render();

  if(typeof toast === "function"){
    toast(`Welcome, ${user.name || user.firstName || "User"}!`);
  }
}

function roleCanAccess(route, role){

  const studentRoutes = [
    "home",

  const facultyRoutes = [
    "faculty",
    "home",
    "notices",
    "events",
    "saved",
    "ask",
    "manage",
    "create",
    "edit",
    "detail"
  ];

  const adminRoutes = [
    "admin",
    "home",
    "notices",
    "events",
    "saved",
    "ask",
    "manage",
    "create",
    "edit",
    "detail"
  ];

  if(route === "profile"){
    return (
      role === "student" ||
      role === "faculty" ||
      role === "admin"
    );
  }

  if(role === "student"){
    return studentRoutes.includes(route);
  }

  if(role === "faculty"){
    return facultyRoutes.includes(route);
  }

  if(role === "admin"){
    return adminRoutes.includes(route);
  }

  return false;
}

function render(){

  const session = getSession();

  let r = current();

  let route = r.split("-")[0];

  /*
     Nobody logged in:
     always show Welcome Page.
  */

  if(!session){

    /*
       Allow Student / Faculty / Admin Sign-Up pages
       before a user is logged in.
    */

    if(route === "signup"){

      const signupRole = r.replace("signup-", "");

      if(
        signupRole === "student" ||
        signupRole === "faculty" ||
        signupRole === "admin"
      ){
        const auth = document.getElementById("authView");

        if(auth){
          auth.style.display = "block";
          auth.innerHTML = signupPage(signupRole);
        }

        const shell = document.getElementById("campusShell");

        if(shell){
          shell.style.display = "none";
        }

        return;
      }
    }

    /*
       login-student, login-faculty and login-admin
       must open their login pages.
    */

    if(route === "login"){

      const loginRole = r.replace("login-", "");

      if(
        loginRole === "student" ||
        loginRole === "faculty" ||
        loginRole === "admin"
      ){
        showLogin(loginRole);
        return;
      }
    }

    if(
      route === "welcome" ||
      route === "login" ||
      !r ||
      r === "home"
    ){
      showWelcome();
      return;
    }

    location.hash = "welcome";

    showWelcome();

    return;
  }

  /*
     Already logged in:
     prevent returning to login/welcome.
  */

  if(
    route === "welcome" ||
    route === "login"
  ){

    location.hash = ROLE_HOME[session.role];

    route = ROLE_HOME[session.role];

    r = route;
  }

  /*
     Check role permissions.
  */

  if(!roleCanAccess(route, session.role)){

    if(typeof toast === "function"){
      toast("You do not have permission to open that page.");
    }

    location.hash = ROLE_HOME[session.role];

    route = ROLE_HOME[session.role];

    r = route;
  }

  const auth =
    document.getElementById("authView");

  const shell =
    document.getElementById("campusShell");

  if(auth){
    auth.innerHTML = "";
    auth.style.display = "none";
  }

  if(shell){
    shell.style.display = "flex";
  }

  /*
     Render view and sync role interface
  */
  renderApp();

  updateAuthInterface();
}

function updateAuthInterface(){

  const session = getSession();

  if(!session){
    return;
  }

  /*
     Hide/show navigation according to role.
  */

  const mgmtSection = document.getElementById("managementNavSection");
  if(mgmtSection){
    mgmtSection.style.display = session.role === "student" ? "none" : "";
  }

  document.querySelectorAll('[data-route="faculty"]')
    .forEach(el => {
      el.style.display =
        (session.role === "faculty" || session.role === "admin")
          ? ""
          : "none";
    });

  document.querySelectorAll('[data-route="admin"]')
    .forEach(el => {
      el.style.display =
        session.role === "admin"
          ? ""
          : "none";
    });

  document.querySelectorAll('[data-route="manage"]')
    .forEach(el => {
      el.style.display =
        session.role === "student"
          ? "none"
          : "";
    });

  document.querySelectorAll('[data-route="create"]')
    .forEach(el => {
      el.style.display =
        session.role === "student"
          ? "none"
          : "";
    });

  /*
     Add logout button if the existing topbar
     does not already contain one.
  */

  let logoutButton =
    document.getElementById("campusaiLogoutButton");

  if(!logoutButton){

    const possibleContainer =
      document.querySelector("header");

    if(possibleContainer){

      logoutButton =
        document.createElement("button");

      logoutButton.id =
        "campusaiLogoutButton";

      logoutButton.className =
        "btn";

      logoutButton.innerHTML = `
        <span class="material-symbols-outlined">
          logout
        </span>
        Logout
      `;

      logoutButton.onclick = logout;

      possibleContainer.appendChild(
        logoutButton
      );
    }
  }

  /*
     Update dynamic avatar with user initials
  */
  const avatarElement = document.getElementById("topUserAvatar");
  if(avatarElement){
    const nameParts = (session.name || session.label || "Student")
      .trim()
      .split(/\s+/);

    const initials = nameParts
      .slice(0, 2)
      .map(part => part.charAt(0))
      .join("")
      .toUpperCase();

    avatarElement.textContent = initials || "CA";
    avatarElement.title = `${session.name || "User"} (${session.label || session.role}) — Click to view profile`;
    avatarElement.style.cursor = "pointer";
    avatarElement.onclick = () => navigate("profile");
  }

  /*
     Update existing avatar/name elements when present.
  */

  const nameElements = [
    document.getElementById("topUserName"),
    document.getElementById("userName"),
    document.getElementById("profileName")
  ];

  nameElements.forEach(el => {
    if(el){
      el.textContent = session.name;
    }
  });
}

function toggleCampusPassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (!input) return;

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
        button.setAttribute("aria-label", "Hide password");
        button.setAttribute("title", "Hide password");
    } else {
        input.type = "password";
        button.textContent = "👁";
        button.setAttribute("aria-label", "Show password");
        button.setAttribute("title", "Show password");
    }
}

function campusPasswordField(
    inputId,
    name,
    label,
    placeholder,
    required = true
) {
    return `
        <div class="auth-field">
            <label for="${inputId}">${label}</label>

            <div class="auth-password-wrap">
                <input
                    id="${inputId}"
                    name="${name}"
                    type="password"
                    placeholder="${placeholder}"
                    ${required ? "required" : ""}
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="auth-password-toggle"
                    onclick="toggleCampusPassword('${inputId}', this)"
                    aria-label="Show password"
                    title="Show password"
                >👁</button>
            </div>
        </div>
    `;
}

                    <button
                        type="submit"
                        class="auth-primary-button"
                    >
                        ${info.button}
                    </button>

                </form>

                <div class="auth-footer">

                    <span>Already have an account?</span>

                    <button
                        class="auth-link-button"
                        onclick="navigate('${info.loginRoute}')"
                    >
                        Sign In
                    </button>

                </div>

                <button
                    class="auth-link-button"
                    onclick="navigate('welcome')"
                    style="margin-top:12px;"
                >
                    ← Back to Welcome
                </button>

            </div>

        </div>
    `;
}

function handleCampusSignup(event, role) {

    event.preventDefault();

    const form = event.target;
    const formData = new FormData(form);

    const firstName =
        String(formData.get("firstName") || "").trim();

    const lastName =
        String(formData.get("lastName") || "").trim();

    const email =
        String(formData.get("email") || "").trim().toLowerCase();

    const identifier =
        String(formData.get("identifier") || "").trim();

    const password =
        String(formData.get("password") || "");

    const confirmPassword =
        String(formData.get("confirmPassword") || "");

    if (!firstName || !lastName || !email || !identifier) {
        alert("Please complete all required fields.");
        return;
    }

    if (password.length < 6) {
        alert("Password must contain at least 6 characters.");
        return;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }

    const users = getCampusUsers();

    const existingUser = users.find(
        user =>
            user.email === email ||
            (
                user.role === role &&
                user.identifier.toLowerCase() ===
                identifier.toLowerCase()
            )
    );

    if (existingUser) {
        alert(
            "An account with this email or ID already exists. Please sign in."
        );

        navigate(
            role === "student"
                ? "login-student"
                : role === "faculty"
                    ? "login-faculty"
                    : "login-admin"
        );

        return;
    }

    const user = {
        id: "user_" + Date.now(),
        role: role,
        label:
            role === "student"
                ? "Student"
                : role === "faculty"
                    ? "Faculty"
                    : "Administrator",

        name: `${firstName} ${lastName}`,
        firstName: firstName,
        lastName: lastName,
        email: email,
        identifier: identifier,
        password: password,

        profileComplete: false,

        createdAt: new Date().toISOString()
    };

    users.push(user);
    saveCampusUsers(users);

    alert(
        "Account created successfully! Please sign in to continue."
    );

    navigate(
        role === "student"
            ? "login-student"
            : role === "faculty"
                ? "login-faculty"
                : "login-admin"
    );
}

/* END CAMPUSAI_SIGNUP_V1 */
</script>

<script>
/* =========================================================

function campusProfilePage(){

  const session = getSession();

  if(!session){
    return "";
  }

  const users = getCampusUsers();

  const savedUser = users.find(user =>
    (session.id && user.id === session.id) ||
    (session.email && user.email?.toLowerCase() === session.email?.toLowerCase()) ||
    (session.identifier && user.identifier?.toLowerCase() === session.identifier?.toLowerCase())
  );

  const user = savedUser ? { ...session, ...savedUser } : session;

  const isStudent = user.role === "student";
  const isFaculty = user.role === "faculty";
  const isAdmin = user.role === "admin";

  return `
    <div class="page">

      <div class="page-head">

        <div>
          <div class="eyebrow">
            ${isStudent ? "Student Profile" : isFaculty ? "Faculty Profile" : "Administrator Profile"}
          </div>

          <h1>
            ${user.profileComplete ? "My Profile" : "Create Your Profile"}
          </h1>

          <div class="subtitle">
            ${user.profileComplete
              ? "View and update your CampusAI profile information."
              : "Complete your CampusAI profile so your account can provide a personalized experience."}
          </div>
        </div>

        ${
          user.profileComplete
          ? `
            <button
              class="btn"
              onclick="navigate(ROLE_HOME['${user.role}'])"
            >
              ← Back to Dashboard
            </button>
          `
          : ""
        }

      </div>

      <div class="card" style="max-width:850px;padding:28px">

        <form
          class="auth-form"
          onsubmit="saveCampusProfile(event)"
        >

          <div class="grid grid-2">

            <div class="auth-field">
              <label>Full Name</label>
              <input
                id="profileName"
                type="text"
                value="${user.name || ""}"
                required
              >
            </div>

            <div class="auth-field">
              <label>Email</label>
              <input
                id="profileEmail"
                type="email"
                value="${user.email || ""}"
                readonly
              >
            </div>

          </div>

          <div class="grid grid-2">

            <div class="auth-field">
              <label>
                ${isStudent ? "Student ID" :
                  isFaculty ? "Employee ID" :
                  "Administrator ID"}
              </label>

              <input
                id="profileIdentifier"
                type="text"
                value="${user.identifier || ""}"
                readonly
              >
            </div>

            <div class="auth-field">
              <label>Phone Number</label>

              <input
                id="profilePhone"
                type="tel"
                value="${user.phone || ""}"
                placeholder="Enter phone number"
              >
            </div>

          </div>

          <div class="grid grid-2">

            <div class="auth-field">
              <label>Department</label>

              <input
                id="profileDepartment"
                type="text"
                value="${user.department || ""}"
                placeholder="${isStudent ? "e.g. Computer Engineering" : isFaculty ? "e.g. Computer Science & Engineering" : "e.g. Campus Administration / Academic Affairs"}"
                required
              >
            </div>

            <div class="auth-field">
              <label>
                ${isStudent ? "Year of Study" :
                  isFaculty ? "Academic Designation" :
                  "Administrative Role / Title"}
              </label>

              <input
                id="profileYear"
                type="text"
                value="${user.year || ""}"
                placeholder="${isStudent ? "e.g. 3rd Year" : isFaculty ? "e.g. Associate Professor / HOD" : "e.g. Senior Administrator / Registrar"}"
              >
            </div>

          </div>

          ${
            !isStudent
            ? `
              <div class="auth-field">
                <label>Office / Cabin Location</label>
                <input
                  id="profileOffice"
                  type="text"
                  value="${user.office || ""}"
                  placeholder="e.g. Cabin 204, Faculty Block B"
                >
              </div>
            `
            : ""
          }

          ${
            isStudent
            ? `
              <div class="grid grid-2">

                <div class="auth-field">
                  <label>Semester</label>

                  <input
                    id="profileSemester"
                    type="text"
                    value="${user.semester || ""}"
                    placeholder="e.g. 6th Semester"
                  >
                </div>

                <div class="auth-field">
                  <label>Section</label>

                  <input
                    id="profileSection"
                    type="text"
                    value="${user.section || ""}"
                    placeholder="e.g. A"
                  >
                </div>

              </div>
            `
            : ""
          }

          <div class="auth-field">

            <label>About You</label>

            <textarea
              id="profileBio"
              rows="4"
              placeholder="Tell us a little about yourself..."
            >${user.bio || ""}</textarea>

          </div>

          <button
            type="submit"
            class="auth-primary-button"
          >
            ${user.profileComplete ? "Save Changes" : "Save Profile & Continue"}
          </button>

        </form>

      </div>

    </div>
  `;
}


function saveCampusProfile(event){

  event.preventDefault();

  const session = getSession();

  if(!session){
    navigate("welcome");
    return;
  }

  const users = getCampusUsers();

  const userIndex = users.findIndex(user =>
    (session.id && user.id === session.id) ||
    (session.email && user.email?.toLowerCase() === session.email?.toLowerCase()) ||
    (session.identifier && user.identifier?.toLowerCase() === session.identifier?.toLowerCase())
  );

  let user;
  if(userIndex !== -1){
    user = users[userIndex];
  } else {
    user = {
      id: session.id || "user_" + Date.now(),
      role: session.role,
      label: session.label,
      email: session.email || session.identifier,
      identifier: session.identifier,
      password: session.password || "",
      createdAt: new Date().toISOString()
    };
    users.push(user);
  }

  user.name =
    document.getElementById("profileName")?.value.trim() || user.name;

  user.phone =
    document.getElementById("profilePhone")?.value.trim() || "";

  user.department =
    document.getElementById("profileDepartment")?.value.trim() || "";

  user.year =
    document.getElementById("profileYear")?.value.trim() || "";

  const office = document.getElementById("profileOffice");
  if(office){
    user.office = office.value.trim();
  }

  const semester =
    document.getElementById("profileSemester");

  const section =
    document.getElementById("profileSection");

  user.semester =
    semester ? semester.value.trim() : (user.semester || "");

  user.section =
    section ? section.value.trim() : (user.section || "");

  user.bio =
    document.getElementById("profileBio")?.value.trim() || "";

  user.profileComplete = true;

  saveCampusUsers(users);

  /*
     Update current login session too.
  */
  const updatedSession = {
    ...session,
    ...user,
    profileComplete: true
  };

  setSession(updatedSession);

  alert("Profile saved successfully!");

  location.hash = ROLE_HOME[updatedSession.role];

  render();
}


/* END CAMPUSAI_PROFILE_V1 */
</script>
